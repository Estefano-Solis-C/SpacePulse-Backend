version: '3.8'

services:
  spacepulse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacepulse-backend-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
    networks:
      - spacepulse-network

networks:
  spacepulse-network:
    driver: bridge
