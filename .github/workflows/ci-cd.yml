name: Backend CI/CD Pipeline (.NET 8 Web API)

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    name: "Build & Verify .NET 8 Web API"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore RentalPeAPI/RentalPeAPI.csproj

      - name: Build Web API (Release)
        run: dotnet build RentalPeAPI/RentalPeAPI.csproj -c Release --no-restore

      - name: Verify Docker Container Build
        run: docker build -t spacepulse-backend:latest .
