name: 🚀 Feature Request
description: Propose a new feature or architectural enhancement
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Please specify user stories and acceptance criteria.
  - type: input
    id: user_story
    attributes:
      label: User Story
      placeholder: "As a [role], I want [capability] so that [benefit]."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria (Given/When/Then)
      placeholder: |
        - Scenario 1: Successful trigger
        - Scenario 2: Error handling
    validations:
      required: true
  - type: dropdown
    id: story_points
    attributes:
      label: Fibonacci Story Points
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
    validations:
      required: true
