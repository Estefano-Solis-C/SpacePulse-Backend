groups:
  - name: spacepulse_alerts
    rules:
      - alert: HighHttp5xxErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate detected on SpacePulse API"
          description: "5xx error rate is above 5% for more than 2 minutes."

      - alert: HighTelemetryAnomalyDetected
        expr: sum(rate(iot_telemetry_anomaly_total[5m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Excessive IoT telemetry anomaly alerts"
          description: "More than 10 threshold violations per minute detected."
